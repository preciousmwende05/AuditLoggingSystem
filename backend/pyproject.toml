[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# B008 flags FastAPI's Depends(...) default-argument idiom, which is
# the documented, correct way to declare dependencies in this
# framework, not a real bug, so it is excluded here.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
